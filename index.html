<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>СвятоЛаб — Свято починається з нас</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Paytone+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Nunito', sans-serif; background: #fff9fc; color: #1e1a2f; overflow-x: hidden; }
  :root {
    --purple: #7b2cbf; --purple-dark: #4a0e78; --pink: #ff5c8a; --gold: #ffcd3c;
    --orange: #ff9f1c; --green: #06d6a0; --shadow-sm: 0 8px 24px rgba(0,0,0,0.05);
    --shadow-md: 0 12px 32px rgba(123,44,191,0.12);
  }

  /* ========== АНІМАЦІЇ ========== */
  @keyframes floatUp {
    0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-20vh) translateX(30px) rotate(360deg); opacity: 0; }
  }
  @keyframes floatUp2 {
    0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-20vh) translateX(-30px) rotate(-360deg); opacity: 0; }
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 5px rgba(255,215,0,0.3), 0 0 10px rgba(255,215,0,0.2); }
    50% { text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 0 30px rgba(255,215,0,0.4); }
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes shine { 0% { background-position: -100% 0; } 100% { background-position: 200% 0; } }

  /* ========== ШАПКА ========== */
  .hero-header {
    background: radial-gradient(circle at 10% 30%, #6a1b9a, #3c096c, #1a0b2e);
    padding: 40px 16px 60px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border-bottom-left-radius: 48px;
    border-bottom-right-radius: 48px;
  }
  .floating-balloon { position: absolute; font-size: 30px; opacity: 0; filter: blur(2px); pointer-events: none; z-index: 0; }
  @media (min-width: 768px) { .floating-balloon { font-size: 40px; } }
  .balloon-1 { animation: floatUp 8s ease-in infinite; left: 5%; }
  .balloon-2 { animation: floatUp 10s ease-in infinite; left: 20%; font-size: 45px; }
  .balloon-3 { animation: floatUp 7s ease-in infinite; left: 35%; font-size: 28px; }
  .balloon-4 { animation: floatUp2 9s ease-in infinite; left: 50%; font-size: 38px; }
  .balloon-5 { animation: floatUp 11s ease-in infinite; left: 65%; font-size: 35px; }
  .balloon-6 { animation: floatUp2 8.5s ease-in infinite; left: 80%; font-size: 42px; }
  .balloon-7 { animation: floatUp 12s ease-in infinite; left: 12%; font-size: 25px; }
  .balloon-8 { animation: floatUp2 9.5s ease-in infinite; left: 55%; font-size: 36px; }
  .balloon-9 { animation: floatUp 7.5s ease-in infinite; left: 42%; font-size: 30px; }
  .balloon-10 { animation: floatUp2 10.5s ease-in infinite; left: 72%; font-size: 32px; }
  .confetti { position: absolute; width: 6px; height: 6px; background: var(--gold); opacity: 0; pointer-events: none; z-index: 0; }
  @media (min-width: 768px) { .confetti { width: 10px; height: 10px; } }
  .confetti-1 { animation: confettiFall 6s linear infinite; left: 5%; background: #FFD700; }
  .confetti-2 { animation: confettiFall 7s linear infinite; left: 15%; background: #FF5C8A; }
  .confetti-3 { animation: confettiFall 5.5s linear infinite; left: 25%; background: #7B2CBF; }
  .confetti-4 { animation: confettiFall 8s linear infinite; left: 35%; background: #00BFFF; }
  .confetti-5 { animation: confettiFall 6.5s linear infinite; left: 45%; background: #FF9F1C; }
  .confetti-6 { animation: confettiFall 7.5s linear infinite; left: 55%; background: #06D6A0; }
  .confetti-7 { animation: confettiFall 5s linear infinite; left: 65%; background: #FFD700; }
  .confetti-8 { animation: confettiFall 9s linear infinite; left: 75%; background: #FF5C8A; }
  .confetti-9 { animation: confettiFall 6.8s linear infinite; left: 85%; background: #7B2CBF; }
  .confetti-10 { animation: confettiFall 7.2s linear infinite; left: 95%; background: #00BFFF; }

  .brand-logo {
    font-family: 'Paytone One', sans-serif;
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(135deg, #FFE6B0, #FFD966, #FFB347, #FFA07A);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 16px;
    cursor: pointer;
    position: relative;
    z-index: 2;
    animation: titleGlow 2s ease-in-out infinite, shine 3s linear infinite;
  }
  @media (min-width: 768px) { .brand-logo { font-size: 72px; margin-bottom: 20px; } }
  .hero-slogan {
    font-size: 18px;
    font-weight: 800;
    color: #fff9e8;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(8px);
    display: inline-block;
    padding: 8px 20px;
    border-radius: 80px;
    margin-bottom: 24px;
    position: relative;
    z-index: 2;
  }
  @media (min-width: 768px) { .hero-slogan { font-size: 26px; padding: 12px 32px; } }
  .hero-slogan span { display: inline-block; animation: pulse 2s ease-in-out infinite; }
  .btn-instagram-hero {
    background: linear-gradient(135deg, #feda77, #f58529, #dd2a7b, #8134af);
    background-size: 200% auto;
    color: white;
    font-weight: 900;
    padding: 12px 28px;
    border-radius: 60px;
    font-size: 15px;
    transition: all 0.3s;
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 2;
    border: none;
    animation: shine 3s linear infinite;
  }
  @media (min-width: 768px) { .btn-instagram-hero { padding: 14px 42px; font-size: 18px; } }

  /* ========== НАВІГАЦІЯ ========== */
  .main-nav {
    background: rgba(255,255,255,0.96);
    padding: 10px 16px;
    display: flex;
    justify-content: flex-start;
    gap: 8px;
    overflow-x: auto;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .main-nav::-webkit-scrollbar { display: none; }
  @media (min-width: 768px) { .main-nav { justify-content: center; flex-wrap: wrap; overflow-x: visible; } }
  .nav-link {
    padding: 8px 18px;
    border-radius: 60px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    background: #f3e8ff;
    color: var(--purple);
    border: none;
    white-space: nowrap;
    transition: 0.3s;
  }
  @media (min-width: 768px) { .nav-link { padding: 10px 24px; font-size: 15px; } }
  .nav-link.active, .nav-link:hover { background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; transform: translateY(-2px); }

  /* ========== СТОРІНКИ ========== */
  .page { display: none; animation: fadeIn 0.5s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .section-title {
    font-family: 'Paytone One', sans-serif;
    font-size: 26px;
    padding: 20px 20px 8px;
    color: #1e1a2f;
    position: relative;
    display: inline-block;
  }
  @media (min-width: 768px) { .section-title { font-size: 32px; padding: 24px 24px 8px; } }
  .section-title::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 20px;
    width: 50px;
    height: 3px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border-radius: 4px;
  }

  /* ========== ТОВАРИ ========== */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px;
  }
  @media (min-width: 550px) { .product-grid { gap: 16px; padding: 20px; } }
  @media (min-width: 768px) { .product-grid { gap: 20px; padding: 20px 24px; } }
  .product-card {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: 0.3s;
    cursor: pointer;
    border: 1px solid #f3e8ff;
  }
  .product-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-md); }
  .product-img {
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #fff0f5, #fae6ff);
    overflow: hidden;
  }
  @media (min-width: 768px) { .product-img { height: 160px; } }
  .product-img img { width: 100%; height: 100%; object-fit: cover; }
  .product-emoji { font-size: 55px; }
  @media (min-width: 768px) { .product-emoji { font-size: 70px; } }
  .product-info { padding: 10px 12px; }
  @media (min-width: 768px) { .product-info { padding: 14px 16px; } }
  .product-name { font-weight: 800; font-size: 13px; margin-bottom: 4px; }
  @media (min-width: 768px) { .product-name { font-size: 15px; margin-bottom: 6px; } }
  .price { font-weight: 900; color: var(--purple); font-size: 15px; }
  @media (min-width: 768px) { .price { font-size: 18px; } }
  .old-price { text-decoration: line-through; font-size: 11px; color: #aaa; margin-left: 6px; }
  .sale-badge-small { background: linear-gradient(135deg, #ff5c8a, #ff2d6e); color: white; font-size: 10px; padding: 2px 6px; border-radius: 20px; margin-left: 6px; }
  .insta-badge {
    background: linear-gradient(135deg, #f58529, #dd2a7b);
    color: white;
    font-size: 11px;
    font-weight: 800;
    border-radius: 60px;
    padding: 6px;
    text-align: center;
    margin-top: 8px;
    display: block;
    text-decoration: none;
  }
  @media (min-width: 768px) { .insta-badge { font-size: 12px; padding: 8px; margin-top: 10px; } }

  /* ========== СТРІЧКИ ========== */
  .scroll-section { padding: 16px 16px 8px; }
  @media (min-width: 768px) { .scroll-section { padding: 24px 24px 16px; } }
  .scroll-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
  .scroll-header h2 { font-family: 'Paytone One', sans-serif; font-size: 20px; color: var(--purple-dark); }
  @media (min-width: 768px) { .scroll-header h2 { font-size: 28px; } }
  .scroll-horizontal { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  @media (min-width: 768px) { .scroll-horizontal { gap: 18px; } }
  .scroll-card {
    flex-shrink: 0;
    width: 140px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    text-align: center;
    transition: 0.3s;
  }
  @media (min-width: 768px) { .scroll-card { width: 180px; border-radius: 28px; } }
  .scroll-img { height: 130px; display: flex; align-items: center; justify-content: center; font-size: 60px; background: linear-gradient(145deg, #fff0f5, #fae6ff); }
  @media (min-width: 768px) { .scroll-img { height: 170px; font-size: 80px; } }
  .scroll-info { padding: 10px 8px 12px; }
  .scroll-title { font-weight: 800; font-size: 12px; }
  .scroll-price { font-weight: 900; color: var(--purple); margin: 4px 0; font-size: 12px; }
  @media (min-width: 768px) { .scroll-title { font-size: 15px; } .scroll-price { font-size: 16px; } }

  /* ========== ПОСЛУГИ ========== */
  .mini-services {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px;
  }
  @media (min-width: 600px) { .mini-services { gap: 16px; padding: 20px; } }
  @media (min-width: 768px) { .mini-services { grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 20px 24px 40px; } }
  .mini-service-card {
    background: white;
    border-radius: 20px;
    padding: 16px 10px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: 0.3s;
  }
  .mini-service-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
  .mini-icon { font-size: 36px; margin-bottom: 8px; display: inline-block; }
  @media (min-width: 768px) { .mini-icon { font-size: 46px; } }
  .mini-title { font-weight: 800; font-size: 14px; }
  .mini-desc { font-size: 10px; color: #6c5b7b; margin: 4px 0; }
  .btn-service {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 60px;
    font-weight: 800;
    font-size: 11px;
    margin-top: 8px;
    cursor: pointer;
  }

  /* ========== КАТЕГОРІЇ ========== */
  .category-strip {
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    background: white;
    border-bottom: 1px solid #f0e6f5;
  }
  .category-strip::-webkit-scrollbar { display: none; }
  @media (min-width: 768px) { .category-strip { padding: 16px 24px; gap: 12px; overflow-x: visible; flex-wrap: wrap; justify-content: center; } }
  .cat-chip {
    background: #f3e8ff;
    padding: 8px 18px;
    border-radius: 60px;
    font-weight: 800;
    font-size: 12px;
    color: var(--purple);
    white-space: nowrap;
    cursor: pointer;
    border: none;
    transition: 0.3s;
  }
  @media (min-width: 768px) { .cat-chip { padding: 10px 22px; font-size: 14px; } }
  .cat-chip.active, .cat-chip:hover { background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; transform: translateY(-2px); }

  /* ========== СОЦМЕРЕЖІ ========== */
  .social-banner {
    background: linear-gradient(115deg, #ffcd3c, #ff9f1c);
    margin: 16px;
    border-radius: 32px;
    padding: 20px 16px;
    text-align: center;
  }
  @media (min-width: 768px) { .social-banner { margin: 16px 24px; border-radius: 40px; padding: 28px 24px; } }
  .social-title { font-family: 'Paytone One', sans-serif; font-size: 22px; margin-bottom: 16px; }
  @media (min-width: 768px) { .social-title { font-size: 28px; } }
  .social-icons { display: flex; justify-content: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
  @media (min-width: 768px) { .social-icons { gap: 20px; } }
  .social-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; transition: 0.3s; }
  .icon-circle { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
  @media (min-width: 768px) { .icon-circle { width: 70px; height: 70px; font-size: 32px; } }
  .social-name { font-weight: 800; color: #1e1a2f; font-size: 11px; }
  .social-buttons { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
  .social-btn-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 60px;
    font-weight: 800;
    font-size: 11px;
    text-decoration: none;
    background: rgba(0,0,0,0.2);
    color: #1e1a2f;
  }
  .instagram .icon-circle { background: linear-gradient(135deg, #feda77, #f58529, #dd2a7b, #8134af); color: white; }
  .tiktok .icon-circle { background: linear-gradient(135deg, #00f2ea, #ff0050); color: white; }
  .facebook .icon-circle { background: linear-gradient(135deg, #1877f2, #0d47a1); color: white; }

  /* ========== МОДАЛЬНЕ ВІКНО ========== */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
  }
  .modal.active { display: flex; }
  .modal-content {
    background: white;
    border-radius: 32px;
    max-width: 450px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    text-align: center;
    position: relative;
  }
  @media (min-width: 768px) { .modal-content { border-radius: 48px; max-width: 500px; padding: 32px; } }
  .modal-close { position: absolute; top: 16px; right: 20px; font-size: 28px; cursor: pointer; background: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .modal-product-img { margin: 20px 0 10px; background: linear-gradient(145deg, #fff0f5, #fae6ff); border-radius: 30px; padding: 20px; min-height: 150px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .modal-product-img img { max-width: 100%; max-height: 150px; object-fit: contain; border-radius: 20px; }
  .modal-product-emoji { font-size: 80px; }
  .modal-product-name { font-family: 'Paytone One', sans-serif; font-size: 24px; margin: 16px 0 8px; }
  .modal-product-price { font-size: 20px; font-weight: 900; color: var(--purple); margin: 8px 0; }
  .modal-section-title { font-weight: 800; font-size: 16px; margin: 20px 0 8px; color: var(--purple-dark); border-left: 4px solid var(--pink); padding-left: 12px; text-align: left; }
  .modal-product-desc { font-size: 14px; line-height: 1.5; color: #444; background: #f9f5ff; padding: 14px; border-radius: 20px; margin: 12px 0; text-align: left; }
  .modal-features { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; justify-content: center; }
  .feature-badge { background: #f0e9fa; padding: 6px 12px; border-radius: 40px; font-size: 12px; font-weight: 600; color: var(--purple); }
  .modal-instagram-btn {
    display: block;
    background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
    color: white;
    text-align: center;
    padding: 12px;
    border-radius: 60px;
    font-weight: 800;
    font-size: 16px;
    text-decoration: none;
    margin-top: 20px;
  }

  /* ========== ФУТЕР ========== */
  footer {
    background: #1e1a2f;
    color: white;
    padding: 32px 20px;
    margin-top: 20px;
    border-radius: 32px 32px 0 0;
  }
  .footer-links { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px 0; cursor: pointer; justify-content: center; }
  .footer-links span { font-size: 12px; transition: 0.2s; }
  .footer-links span:hover { color: var(--gold); transform: translateX(3px); }
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(20px);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 20px;
    z-index: 50;
    border-top: 1px solid rgba(0,0,0,0.05);
  }
  @media (min-width: 768px) { .bottom-nav { display: none; } }
  .bottom-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; color: #aaa; cursor: pointer; padding: 4px 12px; border-radius: 40px; }
  .bottom-item i { font-size: 20px; }
  .bottom-item.active, .bottom-item:hover { color: var(--purple); background: rgba(123,44,191,0.1); }
  body { padding-bottom: 65px; }
  @media (min-width: 768px) { body { padding-bottom: 0; } }

  .no-results { text-align: center; padding: 40px; color: #aaa; grid-column: 1/-1; }
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: linear-gradient(135deg, #06d6a0, #00b4d8);
    color: white;
    padding: 12px 24px;
    border-radius: 60px;
    z-index: 1001;
    font-weight: 700;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>

<!-- ШАПКА -->
<section class="hero-header">
  <div class="floating-balloon balloon-1">🎈</div>
  <div class="floating-balloon balloon-2">🎈</div>
  <div class="floating-balloon balloon-3">🎈</div>
  <div class="floating-balloon balloon-4">🎈</div>
  <div class="floating-balloon balloon-5">🎈</div>
  <div class="floating-balloon balloon-6">🎈</div>
  <div class="floating-balloon balloon-7">🎈</div>
  <div class="floating-balloon balloon-8">🎈</div>
  <div class="floating-balloon balloon-9">🎈</div>
  <div class="floating-balloon balloon-10">🎈</div>
  <div class="confetti confetti-1"></div><div class="confetti confetti-2"></div><div class="confetti confetti-3"></div>
  <div class="confetti confetti-4"></div><div class="confetti confetti-5"></div><div class="confetti confetti-6"></div>
  <div class="confetti confetti-7"></div><div class="confetti confetti-8"></div><div class="confetti confetti-9"></div>
  <div class="confetti confetti-10"></div>

  <div class="brand-logo" data-page="home">СвятоЛаб</div>
  <div class="hero-slogan"><span>✨</span> Свято починається з нас <span>✨</span></div>
  <div class="hero-buttons">
    <a href="https://instagram.com/svyato.lab" target="_blank" class="btn-instagram-hero"><i class="fab fa-instagram"></i> Перейти в Instagram</a>
